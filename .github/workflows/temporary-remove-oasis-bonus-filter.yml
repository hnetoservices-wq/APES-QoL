name: Temporary Remove Oasis Bonus Filter

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch-oasis-scanner:
    if: github.event.issue.title == 'TEMP: Remove Oasis Scanner bonus dropdown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove bonus filter from Oasis Scanner toolbar
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("features/oasisScanner.js")
          raw = path.read_bytes().decode("utf-8")
          newline = "\r\n" if "\r\n" in raw else "\n"
          text = raw.replace("\r\n", "\n")

          def replace_once(label, old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "resource filter helper",
              '''  function getSelectedResourceFilter() {
    return document.getElementById("qol-oasis-resource-filter")?.value || "all";
  }

''',
              "",
          )

          replace_once(
              "resource filter state",
              '''    const typeFilter = getSelectedTypeFilter();

    const resourceFilter = getSelectedResourceFilter();

    const searchValue = getSearchValue();
''',
              '''    const typeFilter = getSelectedTypeFilter();

    const searchValue = getSearchValue();
''',
          )

          replace_once(
              "resource filter application",
              '''    if (resourceFilter !== "all") {
      entries = entries.filter((entry) => Number(entry.bonus?.[resourceFilter]) > 0);
    }

''',
              "",
          )

          replace_once(
              "toolbar resource filter",
              '''          <select
            id="qol-oasis-resource-filter"
            title="Require this resource bonus"
          >
            <option value="all">
              All Bonuses
            </option>

            <option value="wood">
              Wood Bonus
            </option>

            <option value="clay">
              Clay Bonus
            </option>

            <option value="iron">
              Iron Bonus
            </option>

            <option value="crop">
              Crop Bonus
            </option>
          </select>

''',
              "",
          )

          replace_once(
              "resource filter listener",
              '''    oasisContainer
      .querySelector("#qol-oasis-resource-filter")
      .addEventListener("change", renderResultsTable);

''',
              "",
          )

          replace_once(
              "toolbar grid",
              '''        grid-template-columns:
          minmax(105px, 1fr)
          minmax(105px, 1fr)
          minmax(130px, 1.3fr)
          minmax(100px, 1fr)
          auto
          auto
          auto
          auto
          auto
          auto
          !important;
''',
              '''        grid-template-columns:
          minmax(105px, 1fr)
          minmax(150px, 1.5fr)
          minmax(100px, 1fr)
          auto
          auto
          auto
          auto
          auto
          auto
          !important;
''',
          )

          path.write_text(text.replace("\n", newline), encoding="utf-8", newline="")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/oasisScanner.js
          git commit -m "Remove Oasis Scanner bonus dropdown"
          git push
