# trigger
name: Temporary Oasis UI Edit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-oasis-ui-edit.yml"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('features/oasisScanner.js')
          s = p.read_text(encoding='utf-8')
          old = '''          <select
            id="qol-oasis-resource-filter"
            title="Require this resource bonus"
          >
            <option value="all">
              All Bonuses
            </option>

            <option value="wood">
              Wood Bonus
            </option>

            <option value="clay">
              Clay Bonus
            </option>

            <option value="iron">
              Iron Bonus
            </option>

            <option value="crop">
              Crop Bonus
            </option>
          </select>

'''
          if old not in s:
              raise SystemExit('dropdown block not found')
          s = s.replace(old, '', 1)
          old = '''    oasisContainer
      .querySelector("#qol-oasis-resource-filter")
      .addEventListener("change", renderResultsTable);

'''
          if old not in s:
              raise SystemExit('listener block not found')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/oasisScanner.js
          git commit -m "Remove Oasis Scanner bonus dropdown"
          git push
